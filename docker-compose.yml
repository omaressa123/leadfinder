services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: leadgen
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"

  api:
    build:
      context: ./backend
      dockerfile: LeadGen.Api/Dockerfile
    depends_on:
      - db
    environment:
      ConnectionStrings__Default: Host=db;Database=leadgen;Username=leadgen;Password=${POSTGRES_PASSWORD:-change-me}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      Jwt__Key: ${JWT_KEY:-dev-only-change-this-key-min-32-chars!!}
      Seed__Email: ${OWNER_EMAIL:-owner@example.com}
      Seed__Password: ${OWNER_PASSWORD:-change-me-now}
      X__BearerToken: ${X_BEARER_TOKEN:-}
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
